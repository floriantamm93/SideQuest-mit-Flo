<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidequest freigeschaltet</title>
    <style>
        :root {
            --bg: #09070d;
            --bg2: #160b1f;
            --card: rgba(24, 16, 32, 0.82);
            --card-border: rgba(255, 255, 255, 0.13);
            --text: #f4edf8;
            --muted: #c8b8d1;
            --accent: #d24b8f;
            --accent2: #8e5cff;
            --good: #9effc7;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--text);
            background: radial-gradient(circle at 20% 20%, rgba(210, 75, 143, 0.28), transparent 28%), radial-gradient(circle at 80% 10%, rgba(142, 92, 255, 0.24), transparent 32%), linear-gradient(145deg, var(--bg), var(--bg2));
            overflow-x: hidden;
        }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
                background-size: 42px 42px;
                mask-image: linear-gradient(to bottom, black, transparent 85%);
            }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            position: relative;
        }

        .bat {
            position: absolute;
            opacity: 0.22;
            font-size: 34px;
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }

            .bat.one {
                top: 12%;
                left: 12%;
                animation-delay: 0s;
            }

            .bat.two {
                top: 18%;
                right: 14%;
                animation-delay: 1.2s;
            }

            .bat.three {
                bottom: 14%;
                left: 18%;
                animation-delay: 2.1s;
            }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-12px) rotate(5deg);
            }
        }

        .card {
            width: min(680px, 100%);
            background: var(--card);
            border: 1px solid var(--card-border);
            box-shadow: 0 24px 80px var(--shadow);
            border-radius: 28px;
            padding: clamp(24px, 5vw, 46px);
            backdrop-filter: blur(14px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

            .card::after {
                content: "";
                position: absolute;
                inset: 1px;
                border-radius: 27px;
                pointer-events: none;
                border: 1px solid rgba(255,255,255,0.05);
            }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            color: var(--muted);
            font-size: 0.92rem;
            letter-spacing: 0.04em;
            margin-bottom: 18px;
            background: rgba(255,255,255,0.04);
        }

        h1 {
            font-size: clamp(2rem, 7vw, 4.1rem);
            line-height: 0.98;
            margin: 0 0 18px;
            letter-spacing: -0.04em;
        }

        p {
            font-size: clamp(1rem, 2.8vw, 1.18rem);
            line-height: 1.6;
            color: var(--muted);
            margin: 0 auto 24px;
            max-width: 54ch;
        }

        .quest-box {
            margin: 26px 0;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            text-align: left;
        }

            .quest-box strong {
                color: var(--text);
            }

        .quest-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px 0;
            color: var(--muted);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

            .quest-row:last-child {
                border-bottom: 0;
            }

        .quest-icon {
            width: 30px;
            text-align: center;
            flex: 0 0 auto;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        button, .fake-button {
            border: 0;
            cursor: pointer;
            border-radius: 999px;
            padding: 13px 18px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 12px 32px rgba(210, 75, 143, 0.28);
            transition: transform 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
        }

            button:hover, .fake-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 16px 38px rgba(210, 75, 143, 0.38);
            }

            button.secondary {
                background: rgba(255,255,255,0.08);
                color: var(--text);
                box-shadow: none;
                border: 1px solid rgba(255,255,255,0.14);
            }

            button.dodge-button {
                position: relative;
                z-index: 3;
                transition: transform 180ms ease, opacity 160ms ease, box-shadow 160ms ease;
            }

                button.dodge-button.done-dodging {
                    transform: none !important;
                }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 420ms ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .choice-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }

        .choice {
            text-align: left;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 14px;
            background: rgba(255,255,255,0.055);
            color: var(--muted);
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease;
        }

            .choice:hover {
                transform: translateY(-2px);
                background: rgba(255,255,255,0.09);
            }

            .choice span {
                display: block;
                color: var(--text);
                font-weight: 700;
                margin-bottom: 5px;
            }

        .tiny {
            margin-top: 22px;
            font-size: 0.9rem;
            color: rgba(244,237,248,0.68);
        }

        .copied {
            color: var(--good);
            margin-top: 14px;
            min-height: 24px;
        }

        @media (max-width: 560px) {
            .choice-grid {
                grid-template-columns: 1fr;
            }

            .buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="bat one">🦇</div>
        <div class="bat two">✦</div>
        <div class="bat three">🕯️</div>

        <section class="card" id="card">
            <div class="eyebrow">🕯️ Sidequest freigeschaltet</div>
            <h1>Eine Quest wartet auf dich.</h1>
            <p>
                Keine Sorge, dies soll kein dramatischer Start sein wie bei Clair :D
            </p>

            <div class="buttons">
                <button onclick="showQuest()">Quest ansehen</button>
                <button class="secondary" onclick="showSoftExit()">Lieber später</button>
            </div>

            <p class="tiny">Hinweis: Diese Quest kann jederzeit pausiert werden.</p>
        </section>
    </main>

    <script>
    function setCard(html) {
      const card = document.getElementById('card');
      card.innerHTML = html;
      card.classList.remove('fade-in');
      void card.offsetWidth;
      card.classList.add('fade-in');
    }

    let noButtonJumps = 0;
    const maxNoButtonJumps = 3;

    function showQuest() {
      noButtonJumps = 0;
      setCard(`
        <div class="eyebrow">📜 Questlog aktualisiert</div>
        <h1>Potentielles Date mit Flo?</h1>
        <p>
          Info's: Es scheint als würde Flo die Konversationen mit dir sehr genießen. 
          Deshalb bietet er dir an auf ein Date mit ihm zu gehen.
          Fühlst du dich dafür bereit?'
        </p>

        <div class="quest-box">
          <div class="quest-row">
            <div class="quest-icon">🎯</div>
            <div><strong>Ziel:</strong> Ein entspanntes Treffen ohne Erwartungsdruck.</div>
          </div>
          <div class="quest-row">
            <div class="quest-icon">✨</div>
            <div><strong>Belohnung:</strong> Gute Gespräche, der ein oder andere Lacher und vielleicht etwas Bauchkribbeln.</div>
          </div>
          <div class="quest-row">
            <div class="quest-icon">🖤</div>
            <div><strong>Schwierigkeitsgrad:</strong> Liegt bei dir. Nur so leicht wie möglich und so schwer wie nötig 🤙🏼</div>
          </div>
        </div>

        <div class="buttons">
          <button onclick="showYes()">Bin interessiert!</button>
          <button
            id="noButton"
            class="secondary dodge-button"
            onclick="handleNoButtonClick(event)"
            onmouseenter="dodgeNoButton(event)"
          >Lieber nicht</button>
        </div>
      `);
    }

    function dodgeNoButton(event) {
      const button = event.currentTarget;

      if (noButtonJumps >= maxNoButtonJumps) {
        button.classList.add('done-dodging');
        button.textContent = 'Okay, Bedenkzeit ist fair';
        return;
      }

      noButtonJumps++;

      const x = Math.floor(Math.random() * 120) - 60;
      const y = Math.floor(Math.random() * 70) - 35;
      const rotate = Math.floor(Math.random() * 12) - 6;

      button.style.transform = `translate(${x}px, ${y}px) rotate(${rotate}deg)`;

      if (noButtonJumps === 1) button.textContent = 'Uff, knapp daneben';
      if (noButtonJumps === 2) button.textContent = 'Sicher? 😌';
      if (noButtonJumps === 3) button.textContent = 'Okay okay, ich bleib stehen';
    }

    function handleNoButtonClick(event) {
      if (noButtonJumps < maxNoButtonJumps) {
        dodgeNoButton(event);
        return;
      }

      showThink();
    }

    function showYes() {
      setCard(`
        <div class="eyebrow">🖤 Quest angenommen</div>
        <h1>Okay wow.</h1>
        <p>
          Ich versuche gerade sehr cool zu bleiben. Klappt mittelmäßig.
          Such dir einfach die Version aus, die sich für dich am angenehmsten anfühlt:
        </p>

        <div class="choice-grid">
          <div class="choice" onclick="copyChoice('Kaffee oder Tee klingt gut :)')">
            <span>☕ Kaffee / Tee</span>
            bisl plaudern, gossip oder deep Talk.
          </div>
          <div class="choice" onclick="copyChoice('Spaziergang klingt gut :)')">
            <span>🌙 Spaziergang</span>
            hoffentlich nicht bei 25°C+ und dann dabei bisl Tiere spotten oder einfach nen kleenes Picknick
          </div>
          <div class="choice" onclick="copyChoice('Zusammen zocken oder streamen klingt gut :)')">
            <span>🎥 Kino/ Film gucken</span>
            Vielleicht ne Serie zusammen bingen oder was im Kino gucken.
          </div>
          <div class="choice" onclick="copyChoice('Such du was aus, ich bin neugierig :)')">
            <span>🦇 Surprise me</span>
            Take the gamble?
          </div>
        </div>

        <p id="copied" class="copied"></p>
        <div class="buttons">
          <button class="secondary" onclick="showQuest()">Zurück</button>
        </div>
      `);
    }

    function showThink() {
      setCard(`
        <div class="eyebrow">🌘 Alles entspannt</div>
        <h1>Kein Druck.</h1>
        <p>
          Wirklich. Ich mag unser Quatschen auch ohne irgendein großes Ding daraus zu machen.
          Du musst nichts sofort beantworten und du schuldest mir keine Reaktion.
        </p>
        <p>
          Wenn du irgendwann Lust hast: cool. Wenn nicht: auch okay.
        </p>
        <div class="buttons">
          <button onclick="showQuest()">Nochmal Quest ansehen</button>
          <button class="secondary" onclick="showSoftExit()">Für heute schließen</button>
        </div>
      `);
    }

    function showSoftExit() {
      setCard(`
        <div class="eyebrow">🕯️ Quest pausiert</div>
        <h1>No worries.</h1>
        <p>
          Wenn du dich noch nicht bereit genug fühlst für diese Aufgabe is das völlig okay!
          Ich bleib trotzdem noch ne Weile hier falls du es dir anders überlegst :)
        </p>
        <div class="buttons">
          <button onclick="showQuest()">Doch ansehen</button>
        </div>
      `);
    }

    function copyChoice(text) {
      const copied = document.getElementById('copied');
      const message = `Antwort an Flo: ${text}`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(message)
          .then(() => copied.textContent = 'Antwort wurde in Zwischenablage kopiert. Jetzt nur noch an Flo schicken 😌')
          .catch(() => copied.textContent = message);
      } else {
        copied.textContent = message;
      }
    }
    </script>
</body>
</html>
